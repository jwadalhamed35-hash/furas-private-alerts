name: Telegram Test Command
on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
    inputs:
      smoke:
        description: Send a live test pair without changing any saved state
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: telegram-test-command
  cancel-in-progress: false
jobs:
  commands:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest test_commands -v
      - name: Handle private test commands
        env:
          SMOKE: ${{ inputs.smoke || false }}
        run: |
          if [ "$SMOKE" = "true" ]; then
            python telegram_commands.py --smoke
          else
            python telegram_commands.py
          fi
      - name: Save command checkpoint only
        if: always()
        run: |
          if [ ! -f state/telegram_test_commands.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/telegram_test_commands.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Save Telegram test command checkpoint'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Recovery command checkpoint
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-test-command-recovery
          path: state/telegram_test_commands.json
          retention-days: 7
