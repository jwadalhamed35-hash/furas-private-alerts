name: Furas Monitor
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview, test delivery, or send new opportunities'
        type: choice
        options: [dry-run, test, monitor]
        default: dry-run
permissions:
  contents: write
concurrency:
  group: furas-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOTIFIER: telegram
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -p test_monitor.py -v
      - name: Scan or test
        env:
          RUN_MODE: ${{ inputs.mode || 'monitor' }}
        run: python monitor.py --mode "$RUN_MODE"
      - name: Save accepted notifications
        if: always()
        run: |
          if [ ! -d .git ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/sent.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Save Furas notification history'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Recovery history
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: notification-state-recovery
          path: state/sent.json
          retention-days: 7
